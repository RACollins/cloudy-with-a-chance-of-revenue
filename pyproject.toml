[project]
name = "cloudy-with-a-chance-of-revenue"
version = "0.1.0"
description = "Lead magnet: time series forecasting with weather covariates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.35.0",
    "httpx>=0.27.0",
    "openmeteo-requests>=1.3.0",
    "pandas>=2.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.2.0",
    "requests-cache>=1.2.0",
    "retry-requests>=2.0.0",
]

[project.optional-dependencies]
frontend = [
    "plotly>=5.24.0",
    "streamlit>=1.39.0",
]
api = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
]
cdk = [
    "aws-cdk-lib>=2.160.0",
    "constructs>=10.4.0",
]

[project.scripts]
cloudy-api = "app.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["ml/tests", "tests"]
